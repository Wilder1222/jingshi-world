<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320">
<style>text{font-family:'Microsoft YaHei',sans-serif;fill:#e7e8e9;font-size:17px}.title{font-size:26px;font-weight:bold}.sub{fill:#adbbc8;font-size:14px}.box{fill:#213348;stroke:#8ca9bd;stroke-width:2}.slot{fill:#30485c;stroke:#91a8b6}.route{fill:none;stroke:#e7bd71;stroke-width:5}.hint{fill:#182838;stroke:#557185;stroke-dasharray:7 5} .small{font-size:14px}</style>
<rect width="1200" height="1320" fill="#101b29"/>
<text x="40" y="42" class="title">顾府二维关系与通行区</text><text x="40" y="70" class="sub">POST-PLAN-COURT 部分设计依据｜上北下南，左西右东｜不按比例，无米制尺寸，不表示空间已验收</text>
<path class="route" d="M600 875V380M600 255V190M330 315H870M250 430V700H600M865 190H1020"/>
<rect class="box" x="455" y="95" width="290" height="110" rx="8"/><text x="475" y="126">S06 后院杂务区</text><text x="475" y="155" class="small">井盆／洗换／湿衣晾挂沿侧缘</text><text x="475" y="180" class="small">短廊接前厅，不穿过书房</text>
<path class="route" d="M745 150H865"/><rect class="box" x="865" y="100" width="280" height="100" rx="8"/><text x="884" y="134">S06-K 东侧外库门口</text><text x="884" y="164" class="small">仅门口可见；不画隐室或通道</text>
<rect class="box" x="445" y="235" width="310" height="200" rx="8"/><text x="465" y="267">S03 前厅</text><rect class="slot" x="510" y="285" width="180" height="40"/><text x="535" y="312">固定大案／真票在内</text><text x="465" y="350" class="small">伤者座位＋照护空位待合人核定</text><rect class="slot" x="638" y="379" width="95" height="37"/><text x="646" y="403" class="small">可搬小案</text><text x="465" y="403" class="small">南入口保持通行</text>
<rect class="box" x="55" y="235" width="320" height="200" rx="8"/><text x="75" y="267">西侧 S05 卧房</text><text x="75" y="304">床＋近侧护理带</text><text x="75" y="336" class="small">盆巾与行囊纸钱分干湿两区</text><text x="75" y="369" class="small">门口→床边；不经外库或室外绕行</text><text x="75" y="404" class="small">床头／伤肩侧与反打仍待核</text>
<rect class="box" x="815" y="235" width="330" height="200" rx="8"/><text x="835" y="267">东侧 S04 书房</text><text x="835" y="304">案（镜／杯／灯）—门—窗柜</text><text x="835" y="336" class="small">局部动作三角／杯落裸石</text><text x="835" y="369" class="small">窗朝府内；门外近廊等候</text><text x="835" y="404" class="small">外圈书柜与坐榻不占动作通路</text>
<rect class="hint" x="420" y="470" width="400" height="310" rx="8"/><text x="445" y="505">S03 外院｜无中央水池</text><text x="445" y="537" class="small">金线表示通行关系，不表示门宽或路长</text><text x="445" y="568" class="small">扶人路线与牵马路线分时进入</text><text x="445" y="599" class="small">花木、山石在侧缘，中央不堆器物</text>
<rect class="box" x="55" y="485" width="320" height="295" rx="8"/><text x="75" y="519">S03-W 外院西侧正式客房</text><text x="75" y="548" class="small">五个独立床位；允许相通房间</text>
<g class="slot"><rect x="75" y="567" width="46" height="68"/><rect x="132" y="567" width="46" height="68"/><rect x="189" y="567" width="46" height="68"/><rect x="246" y="567" width="46" height="68"/><rect x="303" y="567" width="46" height="68"/></g>
<text x="84" y="607" class="small">床1</text><text x="141" y="607" class="small">床2</text><text x="198" y="607" class="small">床3</text><text x="255" y="607" class="small">床4</text><text x="312" y="607" class="small">床5</text>
<text x="75" y="670" class="small">未指定五人床序；不代表五床同镜</text><text x="75" y="703" class="small">独立器物／行囊区，不放床上</text><text x="75" y="740" class="small">饭食区与卸甲区分开，走道贯通</text>
<g transform="translate(-815,545)"><rect class="hint" x="870" y="485" width="275" height="230" rx="8"/><text x="890" y="519">西厢外四坐骑系留区</text><text x="890" y="550" class="small">下方为西侧区域放大示意</text><text x="890" y="584">H01　H02　H05　H08</text><text x="890" y="618" class="small">不占中轴；不进客房</text><text x="890" y="650" class="small">四驾与P01留林道，不在府内</text><text x="890" y="683" class="small">牵引／转身／间距另验</text></g>
<path class="route" d="M600 820H180V905"/><rect class="box" x="90" y="795" width="220" height="64" rx="8"/><text x="110" y="834">西侧道→侧门→西巷</text>
<rect class="box" x="475" y="815" width="250" height="68" rx="8"/><text x="494" y="843">正门／门内小案工作位</text><text x="494" y="868" class="small">仅剧情需要时搬来，真票不跟来</text>
<path class="route" d="M100 920H1120M600 883V920"/><text x="400" y="951">南街 S02｜同街短墙连接赵孟查问处</text><text x="40" y="1291" class="sub">未定：各房开间和标高、床柜成人尺度、门扇扫掠、四馬净距、室内候选反打。无人物／不新增剧情地道。</text>
<path d="M55 740H35V1060H55" fill="none" stroke="#8ca9bd" stroke-dasharray="7 5"/><text x="390" y="1080" class="sub">系马区按生产源在西厢外；此放大栏不表示独立新院。</text></svg>
